<script>
    // ----------------------------------------------------
    // ⚠️ 请务必确保这里的 SUPABASE_KEY 已经替换为你真实的 anon key 字符串！
    // ----------------------------------------------------
    const SUPABASE_URL = 'https://oxaagpiaiieiavmrtzkq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_wUmuXR2Rub4-IEDidKTkrA_Pd-jlsj5';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 全局内存数据
    let inventoryData = [];
    let recipesData = [];

    // 初始化
    window.onload = async () => {
      await refreshInventory();
      await refreshRecipes();
      await refreshLogs();
      addDietItemRow();
      addRecipeItemRow();
    };

    // 标签页切换
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`panel-${tabName}`).classList.add('active');
    }

    // ====================================================
    // 1. 库存板块 (Inventory)
    // ====================================================
    async function refreshInventory() {
      const { data, error } = await db.from('inventory').select('*').order('id', { ascending: false });
      if (error) {
        console.error('获取库存失败:', error);
        return;
      }
      inventoryData = data || [];

      const listEl = document.getElementById('inventory-list');
      if (inventoryData.length === 0) {
        listEl.innerHTML = '<li style="color:#9ca3af;font-size:0.9rem;">库存空空如也，快去买菜入库吧~</li>';
        return;
      }

      listEl.innerHTML = inventoryData.map(item => `
        <li class="item-row">
          <div class="item-info">
            <strong>${item.name}</strong>
            <div class="item-sub">单价：¥${(item.price_per_g || 0).toFixed(4)}/g (约 ¥${((item.price_per_g || 0)*500).toFixed(2)}/斤)</div>
          </div>
          <div>
            <span class="badge">${item.amount_g} 克</span>
            <button class="btn-del" onclick="deleteInventory(${item.id})">删除</button>
          </div>
        </li>
      `).join('');

      updateSelectDropdowns();
    }

    async function addInventory() {
      const name = document.getElementById('inv-name').value.trim();
      const amountG = parseFloat(document.getElementById('inv-amount').value);
      const totalPrice = parseFloat(document.getElementById('inv-price').value);

      if (!name || isNaN(amountG) || isNaN(totalPrice) || amountG <= 0) {
        alert('请填入有效的食材名称、重量和金额！');
        return;
      }

      const existing = inventoryData.find(i => i.name === name);
      let newAmount = amountG;
      let newPricePerG = totalPrice / amountG;
      let err = null;

      if (existing) {
        const oldTotalCost = (existing.amount_g || 0) * (existing.price_per_g || 0);
        newAmount = existing.amount_g + amountG;
        newPricePerG = (oldTotalCost + totalPrice) / newAmount;

        const res = await db.from('inventory').update({
          amount_g: newAmount,
          price_per_g: newPricePerG
        }).eq('id', existing.id);
        err = res.error;
      } else {
        const res = await db.from('inventory').insert([{
          name: name,
          amount_g: newAmount,
          price_per_g: newPricePerG
        }]);
        err = res.error;
      }

      if (err) {
        alert('买菜入库失败，数据库报错：' + err.message);
        console.error(err);
        return;
      }

      document.getElementById('inv-name').value = '';
      document.getElementById('inv-amount').value = '';
      document.getElementById('inv-price').value = '';
      alert('入库成功！');
      refreshInventory();
    }

    async function deleteInventory(id) {
      if (confirm('确定要从库存中删除该食材吗？')) {
        const { error } = await db.from('inventory').delete().eq('id', id);
        if (error) alert('删除失败：' + error.message);
        else refreshInventory();
      }
    }

    // ====================================================
    // 2. 菜谱板块 (Recipes)
    // ====================================================
    function addRecipeItemRow(name = '', amount = '') {
      const container = document.getElementById('recipe-items-container');
      const div = document.createElement('div');
      div.className = 'ingredient-input-row';
      div.innerHTML = `
        <input type="text" class="rec-item-name" placeholder="食材名" value="${name}">
        <input type="number" class="rec-item-amount" placeholder="克数" value="${amount}" style="width:100px;">
        <button class="btn-remove-row" onclick="this.parentElement.remove()">×</button>
      `;
      container.appendChild(div);
    }

    async function saveRecipe() {
      const name = document.getElementById('recipe-name').value.trim();
      if (!name) return alert('请输入菜谱名称！');

      const nameInputs = document.querySelectorAll('.rec-item-name');
      const amountInputs = document.querySelectorAll('.rec-item-amount');
      const ingredients = [];

      nameInputs.forEach((input, index) => {
        const ingName = input.value.trim();
        const ingAmount = parseFloat(amountInputs[index].value);
        if (ingName && !isNaN(ingAmount) && ingAmount > 0) {
          ingredients.push({ name: ingName, amount_g: ingAmount });
        }
      });

      if (ingredients.length === 0) return alert('请至少添加一种有效食材和克数！');

      const { error } = await db.from('recipes').insert([{ name, ingredients }]);
      if (error) {
        alert('保存失败，真实报错：' + error.message);
        console.error(error);
      } else {
        alert('菜谱保存成功！');
        document.getElementById('recipe-name').value = '';
        document.getElementById('recipe-items-container').innerHTML = '';
        addRecipeItemRow();
        refreshRecipes();
      }
    }

    async function refreshRecipes() {
      const { data, error } = await db.from('recipes').select('*').order('id', { ascending: false });
      if (error) {
        console.error('获取菜谱失败:', error);
        return;
      }
      recipesData = data || [];

      const listEl = document.getElementById('recipe-list');
      listEl.innerHTML = recipesData.map(r => `
        <li class="item-row">
          <div class="item-info">
            <strong>${r.name}</strong>
            <div class="item-sub">${r.ingredients.map(i => `${i.name}${i.amount_g}g`).join(', ')}</div>
          </div>
          <button class="btn-del" onclick="deleteRecipe(${r.id})">删除</button>
        </li>
      `).join('');

      const select = document.getElementById('diet-recipe-select');
      select.innerHTML = '<option value="">-- 选择菜谱或自由填写 --</option>' + 
        recipesData.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
    }

    async function deleteRecipe(id) {
      if (confirm('确定要删除该菜谱吗？')) {
        const { error } = await db.from('recipes').delete().eq('id', id);
        if (error) alert('删除失败：' + error.message);
        else refreshRecipes();
      }
    }

    // ====================================================
    // 3. 今日饮食板块 (Diet Logs & Deductions)
    // ====================================================
    function updateSelectDropdowns() {}

    function addDietItemRow(name = '', amount = '') {
      const container = document.getElementById('diet-items-container');
      const div = document.createElement('div');
      div.className = 'ingredient-input-row';
      
      let optionsHtml = inventoryData.map(i => `<option value="${i.name}">${i.name} (剩${i.amount_g}g)</option>`).join('');

      div.innerHTML = `
        <input type="text" class="diet-item-name" placeholder="食材名" value="${name}" list="inventory-options">
        <datalist id="inventory-options">${optionsHtml}</datalist>
        <input type="number" class="diet-item-amount" placeholder="克数" value="${amount}" style="width:110px;">
        <button class="btn-remove-row" onclick="this.parentElement.remove()">×</button>
      `;
      container.appendChild(div);
    }

    function loadRecipeToDiet() {
      const recipeName = document.getElementById('diet-recipe-select').value;
      if (!recipeName) return;

      const recipe = recipesData.find(r => r.name === recipeName);
      if (!recipe) return;

      const container = document.getElementById('diet-items-container');
      container.innerHTML = '';
      recipe.ingredients.forEach(i => {
        addDietItemRow(i.name, i.amount_g);
      });
    }

    async function submitDietLog() {
      const mealType = document.getElementById('diet-meal-type').value;
      const recipeSelect = document.getElementById('diet-recipe-select').value;
      
      const nameInputs = document.querySelectorAll('.diet-item-name');
      const amountInputs = document.querySelectorAll('.diet-item-amount');

      const usedItems = [];
      let totalWeightG = 0;
      let totalCost = 0;

      for (let i = 0; i < nameInputs.length; i++) {
        const ingName = nameInputs[i].value.trim();
        const ingAmount = parseFloat(amountInputs[i].value);

        if (ingName && !isNaN(ingAmount) && ingAmount > 0) {
          const invItem = inventoryData.find(item => item.name === ingName);
          const pricePerG = invItem ? (invItem.price_per_g || 0) : 0;
          const itemCost = ingAmount * pricePerG;

          usedItems.push({
            name: ingName,
            amount_g: ingAmount,
            cost: itemCost
          });

          totalWeightG += ingAmount;
          totalCost += itemCost;

          if (invItem) {
            const updatedAmount = Math.max(0, invItem.amount_g - ingAmount);
            await db.from('inventory').update({ amount_g: updatedAmount }).eq('id', invItem.id);
          }
        }
      }

      if (usedItems.length === 0) return alert('请至少填写一项食用食材！');

      const { error } = await db.from('diet_logs').insert([{
        meal_type: mealType,
        recipe_name: recipeSelect || '自由搭配',
        total_weight_g: totalWeightG,
        total_cost: totalCost,
        items: usedItems
      }]);

      if (error) {
        alert('提交饮食记录失败，真实报错：' + error.message);
        console.error(error);
        return;
      }

      alert(`记录成功！\n本餐总重量：${totalWeightG} 克\n食材花费：¥${totalCost.toFixed(2)} 元\n（库存已自动扣除）`);

      document.getElementById('diet-items-container').innerHTML = '';
      addDietItemRow();
      await refreshInventory();
      await refreshLogs();
    }

    // ====================================================
    // 4. 饮食日志 (Logs)
    // ====================================================
    async function refreshLogs() {
      const { data, error } = await db.from('diet_logs').select('*').order('id', { ascending: false }).limit(20);
      if (error) {
        console.error('获取日志失败:', error);
        return;
      }
      const logs = data || [];

      const listEl = document.getElementById('log-list');
      if (logs.length === 0) {
        listEl.innerHTML = '<li style="color:#9ca3af;font-size:0.9rem;">暂无饮食记录</li>';
        return;
      }

      listEl.innerHTML = logs.map(log => {
        const dateStr = new Date(log.created_at).toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
        const itemsDetail = (log.items || []).map(i => `${i.name}${i.amount_g}g`).join(', ');

        return `
          <li class="item-row">
            <div class="item-info">
              <strong>[${log.meal_type}] ${log.recipe_name}</strong>
              <div class="item-sub">${itemsDetail} (${dateStr})</div>
            </div>
            <div style="text-align:right;">
              <span class="badge" style="background:#f3f4f6;color:#374151;">${log.total_weight_g}g</span>
              <span class="badge badge-cost">¥${(log.total_cost || 0).toFixed(2)}</span>
            </div>
          </li>
        `;
      }).join('');
    }
  </script>
