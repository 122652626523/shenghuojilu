<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生活记录 - 饮食与库存管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2d5e40;
      --primary-light: #e8f0eb;
      --bg: #f6f5f0;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --text-light: #7f8c8d;
      --danger: #e74c3c;
      --warning: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; -webkit-tap-highlight-color: transparent; }
    
    header { background: var(--primary); color: white; padding: 14px; text-align: center; font-size: 1.1rem; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    
    .tabs { display: flex; background: white; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 100; }
    .tab-btn { flex: 1; padding: 12px 4px; text-align: center; font-size: 0.88rem; background: none; border: none; cursor: pointer; color: var(--text-light); border-bottom: 3px solid transparent; font-weight: 500; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }
    
    .container { max-width: 600px; margin: 10px auto; padding: 0 10px; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* 日历栏 */
    .calendar-bar { background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .date-display { font-weight: bold; font-size: 1.05rem; color: #111; display: flex; align-items: center; gap: 6px; }
    .date-input-hidden { border: none; background: transparent; font-size: 0.95rem; color: var(--primary); font-weight: bold; cursor: pointer; outline: none; }

    /* 餐别卡片 (图二样式) */
    .meal-section { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .meal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #f3f4f6; }
    .meal-title { font-weight: bold; font-size: 1rem; color: #111; display: flex; align-items: center; gap: 6px; }
    .meal-add-btn { background: var(--primary-light); color: var(--primary); border: none; padding: 4px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: bold; cursor: pointer; }

    /* 图二：饮食条目与竖向食材列表 */
    .food-card { background: #fafafa; border: 1px solid #edf2f7; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
    .food-card:last-child { margin-bottom: 0; }
    
    .food-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 6px; }
    .food-title-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .food-name-title { font-weight: bold; font-size: 0.95rem; color: #1a202c; }
    
    .food-stats-summary { display: flex; gap: 8px; font-size: 0.78rem; font-weight: bold; }
    .stat-badge-weight { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 6px; }
    .stat-badge-price { background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 6px; }

    /* 竖向显示的食材列表 (图二样式) */
    .vertical-ingredients-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; padding-left: 4px; }
    .vertical-ingredient-item { font-size: 0.85rem; color: #4a5568; display: flex; justify-content: space-between; align-items: center; }
    .ing-name { font-weight: 600; color: #2d3748; }
    .ing-detail { font-size: 0.78rem; color: #718096; }

    /* 状态标签 */
    .status-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 8px; font-weight: bold; }
    .status-planned { background: #fef3c7; color: #92400e; }
    .status-completed { background: #dcfce7; color: #166534; }

    /* 通用表单与卡片 */
    .card { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.8rem; color: var(--text-light); margin-bottom: 4px; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 0.9rem; background: #fafafa; outline: none; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    button.btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 12px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
    .btn-complete { background: var(--primary); color: white; border: none; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-danger-sm { background: #fee2e2; color: #dc2626; border: none; padding: 4px 8px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }
    .btn-warn-sm { background: #fef3c7; color: #b45309; border: none; padding: 4px 8px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }

    /* 库存标签 (图一右侧新增结果) */
    .item-list { list-style: none; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
    .badge-group { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
    .badge { padding: 2px 6px; border-radius: 8px; font-size: 0.72rem; font-weight: 500; }
    .badge-actual { background: #e0f2fe; color: #0369a1; }
    .badge-planned { background: #fef3c7; color: #92400e; }
    .badge-result-pos { background: #dcfce7; color: #15803d; font-weight: bold; }
    .badge-result-neg { background: #fee2e2; color: #b91c1c; font-weight: bold; }

    .procurement-section { background: #fff5f5; border: 1px solid #fed7d7; border-radius: 14px; padding: 12px; margin-bottom: 14px; }
    .procurement-title { font-weight: bold; color: #c53030; font-size: 0.92rem; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }

    /* 菜谱样式 */
    .recipe-header-bar { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-input { flex: 1; background: #fff; border-radius: 20px; border: 1px solid #e5e7eb; padding: 8px 16px; font-size: 0.85rem; }
    .btn-add-recipe { background: var(--primary); color: white; border: none; padding: 0 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }

    .recipe-main-layout { display: flex; gap: 10px; align-items: flex-start; }
    .category-sidebar { width: 75px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .cat-item { padding: 9px 4px; text-align: center; border-radius: 10px; font-size: 0.78rem; cursor: pointer; background: #fff; color: var(--text-light); font-weight: 500; }
    .cat-item.active { background: var(--primary); color: white; font-weight: bold; }

    @media (max-width: 500px) {
      .recipe-main-layout { flex-direction: column; }
      .category-sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
      .cat-item { flex-shrink: 0; padding: 6px 14px; border-radius: 16px; }
    }

    .recipe-cards-list { flex: 1; display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .recipe-card-item { background: #fff; border-radius: 14px; padding: 10px; display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); cursor: pointer; }
    .recipe-thumb { width: 65px; height: 65px; border-radius: 10px; object-fit: cover; background: #eee; flex-shrink: 0; }
    .recipe-info { flex: 1; min-width: 0; }
    .recipe-name-title { font-weight: bold; font-size: 0.92rem; margin-bottom: 3px; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recipe-sub-text { font-size: 0.75rem; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 弹窗 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 12px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: white; width: 100%; max-width: 480px; border-radius: 20px; overflow: hidden; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .detail-hero-img { width: 100%; height: 180px; object-fit: cover; background: #f3f4f6; }
    .detail-content { padding: 16px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 10px 16px; background: #fff; border-top: 1px solid #f0f0f0; display: flex; gap: 8px; justify-content: flex-end; }
    .btn-secondary { background: #f3f4f6; color: #4b5563; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; }

    .upload-box { width: 100%; height: 130px; border: 2px dashed #d1d5db; border-radius: 12px; background: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
    .upload-box img { width: 100%; height: 100%; object-fit: cover; display: none; }

    .ingredient-input-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .btn-remove-row { background: #fee2e2; color: #dc2626; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer; flex-shrink: 0; }
    .btn-add-row { background: #f3f4f6; color: var(--text); border: 1px dashed #d1d5db; padding: 8px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 0.82rem; margin-bottom: 10px; }
  </style>
</head>
<body>

  <header>🥗 生活记录 - 饮食与库存</header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('diet')">📅 饮食日历</button>
    <button class="tab-btn" onclick="switchTab('inventory')">🛒 买菜/库存</button>
    <button class="tab-btn" onclick="switchTab('recipes')">📖 私人菜谱</button>
  </div>

  <div class="container">

    <!-- 1. 饮食日历（包含预扣除、记录与按日期查询） -->
    <div id="panel-diet" class="panel active">
      <div class="calendar-bar">
        <div class="date-display">
          📅 <input type="date" id="diet-date-picker" class="date-input-hidden" onchange="onDateChange()">
        </div>
        <button class="meal-add-btn" onclick="openAddDietModal()">+ 预安排/记录饮食</button>
      </div>

      <!-- 早餐 -->
      <div class="meal-section">
        <div class="meal-header">
          <div class="meal-title">🌅 早餐</div>
          <button class="meal-add-btn" onclick="openAddDietModal('早餐')">+ 添加</button>
        </div>
        <div id="meal-list-早餐">加载中...</div>
      </div>

      <!-- 午餐 -->
      <div class="meal-section">
        <div class="meal-header">
          <div class="meal-title">☀️ 午餐</div>
          <button class="meal-add-btn" onclick="openAddDietModal('午餐')">+ 添加</button>
        </div>
        <div id="meal-list-午餐">加载中...</div>
      </div>

      <!-- 晚餐 -->
      <div class="meal-section">
        <div class="meal-header">
          <div class="meal-title">🌙 晚餐</div>
          <button class="meal-add-btn" onclick="openAddDietModal('晚餐')">+ 添加</button>
        </div>
        <div id="meal-list-晚餐">加载中...</div>
      </div>

      <!-- 加餐 / 夜宵 -->
      <div class="meal-section">
        <div class="meal-header">
          <div class="meal-title">🍎 加餐 / 夜宵</div>
          <button class="meal-add-btn" onclick="openAddDietModal('加餐')">+ 添加</button>
        </div>
        <div id="meal-list-加餐">加载中...</div>
      </div>
    </div>

    <!-- 2. 买菜 / 库存（含【需要采购区】与【结余/结果】） -->
    <div id="panel-inventory" class="panel">
      
      <!-- 最顶部：需要采购区 (结余为负数的物品自动提至此处) -->
      <div id="procurement-container" class="procurement-section" style="display: none;">
        <div class="procurement-title">🚨 需要采购区 (缺货物品)</div>
        <ul id="procurement-list" class="item-list"></ul>
      </div>

      <div class="card">
        <div class="card-title">🛒 买菜入库</div>
        <div class="form-group">
          <label>食材名称</label>
          <input type="text" id="inv-name" placeholder="例如：番茄、猪肉、鸡蛋">
        </div>
        <div class="row">
          <div class="form-group">
            <label>购买重量 (克)</label>
            <input type="number" id="inv-amount" placeholder="500">
          </div>
          <div class="form-group">
            <label>总花费 (元)</label>
            <input type="number" id="inv-price" step="0.01" placeholder="12.5">
          </div>
        </div>
        <button class="btn-primary" onclick="addInventory()">买菜入库</button>
      </div>

      <div class="card">
        <div class="card-title">📦 现有库存与预扣除明细</div>
        <ul id="inventory-list" class="item-list">加载中...</ul>
      </div>
    </div>

    <!-- 3. 私人菜谱 -->
    <div id="panel-recipes" class="panel">
      <div class="recipe-header-bar">
        <input type="text" id="recipe-search" class="search-input" placeholder="🔍 搜索菜名、食材..." oninput="renderRecipesList()">
        <button class="btn-add-recipe" onclick="openRecipeEditModal()">+ 添加</button>
      </div>

      <div class="recipe-main-layout">
        <div class="category-sidebar">
          <div class="cat-item active" onclick="selectCategory('全部', this)">全部</div>
          <div class="cat-item" onclick="selectCategory('家常菜', this)">家常菜</div>
          <div class="cat-item" onclick="selectCategory('凉菜', this)">凉菜</div>
          <div class="cat-item" onclick="selectCategory('汤羹', this)">汤羹</div>
          <div class="cat-item" onclick="selectCategory('蒸煮炖', this)">蒸煮炖</div>
        </div>
        <div id="recipe-cards-container" class="recipe-cards-list">加载中...</div>
      </div>
    </div>

  </div>

  <!-- 弹窗 1：添加/预计划饮食弹窗 -->
  <div id="modal-add-diet" class="modal-overlay">
    <div class="modal-card">
      <div style="padding: 14px 16px; border-bottom:1px solid #f0f0f0; font-weight:bold; font-size:1rem;">
        📝 记录 / 预计划一餐
      </div>
      <div class="detail-content">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="diet-form-date">
        </div>
        <div class="form-group">
          <label>餐别</label>
          <select id="diet-meal-type">
            <option value="早餐">早餐</option>
            <option value="午餐" selected>午餐</option>
            <option value="晚餐">晚餐</option>
            <option value="加餐">加餐/夜宵</option>
          </select>
        </div>

        <div class="form-group">
          <label>快捷导入菜谱（可选）</label>
          <select id="diet-recipe-select" onchange="loadRecipeToDiet()">
            <option value="">-- 选择菜谱或自由填写 --</option>
          </select>
        </div>

        <label>食用食材与标准克数</label>
        <div id="diet-items-container"></div>
        <button class="btn-add-row" onclick="addDietItemRow()">+ 添加食材</button>

      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal('modal-add-diet')">取消</button>
        <button class="btn-primary" style="margin-top:0; width:auto;" onclick="submitDietLog()">保存预安排</button>
      </div>
    </div>
  </div>

  <!-- 弹窗 2：菜谱详情页 -->
  <div id="modal-detail" class="modal-overlay">
    <div class="modal-card">
      <img id="detail-img" src="" class="detail-hero-img" alt="菜谱图">
      <div class="detail-content">
        <span id="detail-category" class="badge badge-actual" style="margin-bottom:8px; display:inline-block;">家常菜</span>
        <div id="detail-title" style="font-size:1.2rem; font-weight:bold; margin-bottom:6px;">菜谱名称</div>
        <div id="detail-video-container"></div>

        <div style="font-weight:bold; font-size:0.88rem; margin:12px 0 6px 0;">所需食材配方</div>
        <div id="detail-ingredients" style="display:grid; grid-template-columns:1fr 1fr; gap:6px;"></div>

        <div style="font-weight:bold; font-size:0.88rem; margin:12px 0 6px 0;">制作流程</div>
        <div id="detail-steps" style="background:#f9fafb; padding:10px; border-radius:8px; font-size:0.82rem; line-height:1.4; white-space:pre-line;">-</div>
      </div>
      <div class="modal-footer">
        <button class="btn-danger-sm" onclick="deleteCurrentRecipe()">删除</button>
        <button class="btn-secondary" onclick="editCurrentRecipe()">编辑</button>
        <button class="btn-secondary" onclick="closeModal('modal-detail')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 弹窗 3：新建 / 编辑菜谱 -->
  <div id="modal-edit" class="modal-overlay">
    <div class="modal-card">
      <div style="padding: 14px 16px; border-bottom:1px solid #f0f0f0; font-weight:bold;" id="modal-edit-title">新建菜谱</div>
      <div class="detail-content">
        <input type="hidden" id="edit-recipe-id">
        <input type="hidden" id="recipe-img-base64">

        <div class="form-group">
          <label>菜品照片</label>
          <div class="upload-box" onclick="document.getElementById('recipe-file-input').click()">
            <img id="upload-preview-img" src="" alt="预览图">
            <div id="upload-placeholder" style="text-align:center; color:var(--text-light);">
              <div style="font-size:1.5rem; color:var(--primary);">+</div>
              <div style="font-size: 0.75rem;">点击上传相册照片</div>
            </div>
          </div>
          <input type="file" id="recipe-file-input" accept="image/*" style="display: none;" onchange="handleImagePick(event)">
        </div>

        <div class="form-group">
          <label>菜谱名称</label>
          <input type="text" id="recipe-name" placeholder="水嫩鸡排">
        </div>
        
        <div class="row">
          <div class="form-group">
            <label>菜品分类</label>
            <select id="recipe-category">
              <option value="家常菜">家常菜</option>
              <option value="凉菜">凉菜</option>
              <option value="汤羹">汤羹</option>
              <option value="蒸煮炖">蒸煮炖</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>原视频链接（选填）</label>
          <input type="text" id="recipe-video-url" placeholder="https://...">
        </div>

        <label>所需食材及标准克数</label>
        <div id="recipe-items-container"></div>
        <button class="btn-add-row" onclick="addRecipeItemRow()">+ 添加食材配方</button>

        <div class="form-group">
          <label>制作流程（选填）</label>
          <textarea id="recipe-steps" rows="3" placeholder="填写步骤..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal('modal-edit')">取消</button>
        <button class="btn-primary" style="margin-top:0; width:auto;" onclick="saveRecipe()">保存菜谱</button>
      </div>
    </div>
  </div>

  <script>
    // ====================================================
    // ⚠️ 请务必把下面的 SUPABASE_KEY 替换为你真实的 anon 密钥！
    // ====================================================
    const SUPABASE_URL = 'https://oxaagpiaiieiavmrtzkq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_wUmuXR2Rub4-IEDidKTkrA_Pd-jlsj5';
    
    let db = null;
    try {
      db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(e) {
      alert('Supabase 初始化失败，请检查 Key！');
    }

    const DEFAULT_IMG = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop';
    let inventoryData = [];
    let recipesData = [];
    let dietLogsData = [];
    let currentSelectedCategory = '全部';
    let currentActiveRecipe = null;
    let selectedDateStr = new Date().toISOString().split('T')[0];

    window.onload = async () => {
      if (!db) return;
      document.getElementById('diet-date-picker').value = selectedDateStr;
      await refreshAll();
    };

    async function refreshAll() {
      await refreshInventory();
      await refreshRecipes();
      await refreshDietLogs();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
      
      const buttons = document.querySelectorAll('.tab-btn');
      if (tabName === 'diet') buttons[0].classList.add('active');
      if (tabName === 'inventory') buttons[1].classList.add('active');
      if (tabName === 'recipes') buttons[2].classList.add('active');
      
      const panel = document.getElementById(`panel-${tabName}`);
      if(panel) panel.classList.add('active');
    }

    function onDateChange() {
      selectedDateStr = document.getElementById('diet-date-picker').value;
      renderDietPage();
    }

    // --- 饮食日历渲染 (按图二风格：总克重、合计使用价格、竖着显示食材) ---
    async function refreshDietLogs() {
      const { data, error } = await db.from('diet_logs').select('*').order('id', { ascending: false });
      if (error) return;
      dietLogsData = data || [];
      renderDietPage();
      refreshInventoryUI();
    }

    function renderDietPage() {
      const meals = ['早餐', '午餐', '晚餐', '加餐'];
      const dayLogs = dietLogsData.filter(log => log.log_date === selectedDateStr);

      meals.forEach(meal => {
        const container = document.getElementById(`meal-list-${meal}`);
        const mealLogs = dayLogs.filter(log => log.meal_type === meal);

        if (mealLogs.length === 0) {
          container.innerHTML = '<div style="color:#9ca3af; font-size:0.8rem; padding:6px 0;">尚未计划/记录</div>';
          return;
        }

        container.innerHTML = mealLogs.map(log => {
          const isPlanned = log.status === 'planned';
          
          // 图二效果：食材竖向排列 HTML
          const ingredientsVerticalHtml = (log.items || []).map(i => `
            <div class="vertical-ingredient-item">
              <span class="ing-name">• ${i.name}</span>
              <span class="ing-detail">${i.amount_g}g (${(i.cost || 0).toFixed(2)}元)</span>
            </div>
          `).join('');

          return `
            <div class="food-card">
              <div class="food-card-top">
                <div>
                  <div class="food-title-group">
                    <span class="food-name-title">${log.recipe_name || '自拟餐点'}</span>
                    <span class="status-badge ${isPlanned ? 'status-planned' : 'status-completed'}">
                      ${isPlanned ? '预计划' : '已完成'}
                    </span>
                  </div>
                  <!-- 图二要求：顶部显示总克重和合计使用的价格 -->
                  <div class="food-stats-summary" style="margin-top: 4px;">
                    <span class="stat-badge-weight">总重: ${log.total_weight_g}g</span>
                    <span class="stat-badge-price">合计使用: ¥${(log.total_cost || 0).toFixed(2)}</span>
                  </div>
                </div>

                <div style="display:flex; gap:6px; align-items:center;">
                  ${isPlanned ? `<button class="btn-complete" onclick="markLogCompleted(${log.id})">点击完成</button>` : ''}
                  <button class="btn-danger-sm" onclick="deleteDietLog(${log.id})">删除</button>
                </div>
              </div>

              <!-- 图二要求：竖着显示使用的食材 -->
              <div class="vertical-ingredients-list">
                ${ingredientsVerticalHtml}
              </div>
            </div>
          `;
        }).join('');
      });
    }

    function openAddDietModal(defaultMeal = '午餐') {
      document.getElementById('diet-form-date').value = selectedDateStr;
      document.getElementById('diet-meal-type').value = defaultMeal;
      document.getElementById('diet-items-container').innerHTML = '';
      addDietItemRow();
      document.getElementById('modal-add-diet').classList.add('active');
    }

    function addDietItemRow(name = '', amount = '') {
      const container = document.getElementById('diet-items-container');
      const div = document.createElement('div');
      div.className = 'ingredient-input-row';
      let optionsHtml = inventoryData.map(i => `<option value="${i.name}">${i.name}</option>`).join('');

      div.innerHTML = `
        <input type="text" class="diet-item-name" placeholder="食材" value="${name}" list="inventory-options">
        <datalist id="inventory-options">${optionsHtml}</datalist>
        <input type="number" class="diet-item-amount" placeholder="克数" value="${amount}" style="width:90px;">
        <button class="btn-remove-row" onclick="this.parentElement.remove()">×</button>
      `;
      container.appendChild(div);
    }

    function loadRecipeToDiet() {
      const recipeName = document.getElementById('diet-recipe-select').value;
      if (!recipeName) return;
      const recipe = recipesData.find(r => r.name === recipeName);
      if (!recipe) return;

      const container = document.getElementById('diet-items-container');
      container.innerHTML = '';
      (recipe.ingredients || []).forEach(i => addDietItemRow(i.name, i.amount_g));
    }

    async function submitDietLog() {
      const logDate = document.getElementById('diet-form-date').value;
      const mealType = document.getElementById('diet-meal-type').value;
      const recipeSelect = document.getElementById('diet-recipe-select').value;
      const nameInputs = document.querySelectorAll('.diet-item-name');
      const amountInputs = document.querySelectorAll('.diet-item-amount');

      const usedItems = [];
      let totalWeightG = 0;
      let totalCost = 0;

      for (let i = 0; i < nameInputs.length; i++) {
        const ingName = nameInputs[i].value.trim();
        const ingAmount = parseFloat(amountInputs[i].value);

        if (ingName && !isNaN(ingAmount) && ingAmount > 0) {
          const invItem = inventoryData.find(item => item.name === ingName);
          const pricePerG = invItem ? (invItem.price_per_g || 0) : 0;
          const itemCost = ingAmount * pricePerG;

          usedItems.push({ name: ingName, amount_g: ingAmount, cost: itemCost });
          totalWeightG += ingAmount;
          totalCost += itemCost;
        }
      }

      if (usedItems.length === 0) return alert('请至少填写一项食材！');

      const { error } = await db.from('diet_logs').insert([{
        log_date: logDate,
        meal_type: mealType,
        recipe_name: recipeSelect || '自拟餐点',
        total_weight_g: totalWeightG,
        total_cost: totalCost,
        items: usedItems,
        status: 'planned'
      }]);

      if (error) alert('保存失败：' + error.message);
      else {
        closeModal('modal-add-diet');
        await refreshDietLogs();
      }
    }

    async function markLogCompleted(logId) {
      const log = dietLogsData.find(l => l.id === logId);
      if (!log) return;

      for (const item of (log.items || [])) {
        const invItem = inventoryData.find(i => i.name === item.name);
        if (invItem) {
          const newAmount = invItem.amount_g - item.amount_g;
          if (newAmount <= 0) {
            await db.from('inventory').delete().eq('id', invItem.id);
          } else {
            await db.from('inventory').update({ amount_g: newAmount }).eq('id', invItem.id);
          }
        }
      }

      await db.from('diet_logs').update({ status: 'completed' }).eq('id', logId);
      alert('已标记完成，并从真实库存中扣除相应克数！');
      await refreshAll();
    }

    async function deleteDietLog(id) {
      if (confirm('确定删除该记录吗？')) {
        await db.from('diet_logs').delete().eq('id', id);
        await refreshDietLogs();
      }
    }

    // --- 库存管理（图一：计算结余，负数自动提至【需要采购区】） ---
    async function refreshInventory() {
      const { data, error } = await db.from('inventory').select('*').order('id', { ascending: false });
      if (error) return;
      inventoryData = data || [];
      refreshInventoryUI();
    }

    function refreshInventoryUI() {
      const listEl = document.getElementById('inventory-list');
      const procurementContainer = document.getElementById('procurement-container');
      const procurementListEl = document.getElementById('procurement-list');

      // 汇总所有“预计划”的总需克数
      const plannedDemandMap = {};
      dietLogsData.filter(l => l.status === 'planned').forEach(log => {
        (log.items || []).forEach(i => {
          plannedDemandMap[i.name] = (plannedDemandMap[i.name] || 0) + i.amount_g;
        });
      });

      // 收集所有食材名称（包含已有的和仅有预计划需求的）
      const allNames = Array.from(new Set([...inventoryData.map(i => i.name), ...Object.keys(plannedDemandMap)]));

      let normalHtml = '';
      let procurementHtml = '';
      let hasProcurementItems = false;

      allNames.forEach(name => {
        const invItem = inventoryData.find(i => i.name === name);
        const currentG = invItem ? invItem.amount_g : 0;
        const plannedG = plannedDemandMap[name] || 0;
        const resultG = currentG - plannedG; // 图一红框：现有 - 预需 的计算结果

        const isNegative = resultG < 0;

        const badgeHtml = `
          <div class="badge-group">
            <span class="badge badge-actual">现有:${currentG}g</span>
            <span class="badge badge-planned">预需:${plannedG}g</span>
            <span class="badge ${isNegative ? 'badge-result-neg' : 'badge-result-pos'}">
              ${isNegative ? `结果:${resultG}g (缺${Math.abs(resultG)}g)` : `结果:+${resultG}g`}
            </span>
          </div>
        `;

        const rowHtml = `
          <li class="item-row">
            <div>
              <strong>${name}</strong>
              ${badgeHtml}
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              ${invItem ? `<button class="btn-warn-sm" onclick="reportLoss(${invItem.id})">损耗</button>` : ''}
              ${invItem ? `<button class="btn-danger-sm" onclick="deleteInventory(${invItem.id})">删除</button>` : ''}
            </div>
          </li>
        `;

        // 核心要求：如果结果是负数，放到最上面的需要采购区
        if (isNegative) {
          procurementHtml += rowHtml;
          hasProcurementItems = true;
        } else if (invItem) {
          normalHtml += rowHtml;
        }
      });

      // 采购区显示与否
      if (hasProcurementItems) {
        procurementContainer.style.display = 'block';
        procurementListEl.innerHTML = procurementHtml;
      } else {
        procurementContainer.style.display = 'none';
        procurementListEl.innerHTML = '';
      }

      if (normalHtml === '') {
        listEl.innerHTML = '<li style="color:#9ca3af;font-size:0.85rem;">暂无充裕库存食材~</li>';
      } else {
        listEl.innerHTML = normalHtml;
      }
    }

    async function reportLoss(id) {
      const item = inventoryData.find(i => i.id === id);
      if (!item) return;

      const lossStr = prompt(`【${item.name}】当前库存为 ${item.amount_g}g，请输入损耗/报废的克数：`);
      if (!lossStr) return;
      const lossG = parseFloat(lossStr);

      if (isNaN(lossG) || lossG <= 0) return alert('请输入有效克数！');

      const remaining = item.amount_g - lossG;
      if (remaining <= 0) {
        alert(`损耗后库存为 0g，已自动清除该食材！`);
        await db.from('inventory').delete().eq('id', id);
      } else {
        await db.from('inventory').update({ amount_g: remaining }).eq('id', id);
        alert(`已成功扣除 ${lossG}g 损耗！`);
      }
      refreshInventory();
    }

    async function addInventory() {
      const name = document.getElementById('inv-name').value.trim();
      const amountG = parseFloat(document.getElementById('inv-amount').value);
      const totalPrice = parseFloat(document.getElementById('inv-price').value);

      if (!name || isNaN(amountG) || isNaN(totalPrice) || amountG <= 0) return alert('请填入有效数据！');

      const existing = inventoryData.find(i => i.name === name);
      let newAmount = amountG;
      let newPricePerG = totalPrice / amountG;

      if (existing) {
        const oldTotalCost = (existing.amount_g || 0) * (existing.price_per_g || 0);
        newAmount = existing.amount_g + amountG;
        newPricePerG = (oldTotalCost + totalPrice) / newAmount;
        await db.from('inventory').update({ amount_g: newAmount, price_per_g: newPricePerG }).eq('id', existing.id);
      } else {
        await db.from('inventory').insert([{ name, amount_g: newAmount, price_per_g: newPricePerG }]);
      }

      document.getElementById('inv-name').value = '';
      document.getElementById('inv-amount').value = '';
      document.getElementById('inv-price').value = '';
      alert('买菜入库成功！');
      refreshInventory();
    }

    async function deleteInventory(id) {
      if (confirm('确认删除该项库存？')) {
        await db.from('inventory').delete().eq('id', id);
        refreshInventory();
      }
    }

    // --- 私人菜谱管理 ---
    async function refreshRecipes() {
      const { data, error } = await db.from('recipes').select('*').order('id', { ascending: false });
      if (error) return;
      recipesData = data || [];
      renderRecipesList();

      const select = document.getElementById('diet-recipe-select');
      select.innerHTML = '<option value="">-- 选择菜谱或自由填写 --</option>' + 
        recipesData.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
    }

    function selectCategory(catName, el) {
      document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentSelectedCategory = catName;
      renderRecipesList();
    }

    function renderRecipesList() {
      const container = document.getElementById('recipe-cards-container');
      const searchKeyword = document.getElementById('recipe-search').value.trim().toLowerCase();

      let filtered = recipesData.filter(r => {
        const matchesCat = (currentSelectedCategory === '全部') || (r.category === currentSelectedCategory);
        const matchesSearch = r.name.toLowerCase().includes(searchKeyword) || 
          (r.ingredients && r.ingredients.some(i => i.name.toLowerCase().includes(searchKeyword)));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="color:#9ca3af;font-size:0.85rem;padding:20px;text-align:center;">暂无相关菜谱~</div>';
        return;
      }

      container.innerHTML = filtered.map(r => {
        const img = r.image_url || DEFAULT_IMG;
        const ingredientsText = (r.ingredients || []).map(i => `${i.name}${i.amount_g}g`).join(' · ');
        return `
          <div class="recipe-card-item" onclick="openRecipeDetail(${r.id})">
            <img src="${img}" class="recipe-thumb" alt="菜谱图">
            <div class="recipe-info">
              <div class="recipe-name-title">${r.name}</div>
              <div class="recipe-sub-text">${ingredientsText || '未设置食材'}</div>
            </div>
            <button class="meal-add-btn" onclick="event.stopPropagation(); openRecipeEditModal(${r.id})">编辑</button>
          </div>
        `;
      }).join('');
    }

    function openRecipeDetail(id) {
      const recipe = recipesData.find(r => r.id === id);
      if (!recipe) return;
      currentActiveRecipe = recipe;

      document.getElementById('detail-img').src = recipe.image_url || DEFAULT_IMG;
      document.getElementById('detail-title').innerText = recipe.name;
      document.getElementById('detail-category').innerText = recipe.category || '家常菜';

      const videoContainer = document.getElementById('detail-video-container');
      if (recipe.video_url && recipe.video_url.trim()) {
        let url = recipe.video_url.trim();
        if (!url.startsWith('http')) url = 'https://' + url;
        videoContainer.innerHTML = `<a href="${url}" target="_blank" style="color:#ff4757; font-weight:bold; font-size:0.8rem; text-decoration:none;">▶️ 点击跳转观看原视频教程</a>`;
      } else {
        videoContainer.innerHTML = '';
      }

      const ingredientsGrid = document.getElementById('detail-ingredients');
      ingredientsGrid.innerHTML = (recipe.ingredients || []).map(i => `
        <div style="background:#f8f9fa; padding:6px 10px; border-radius:8px; font-size:0.8rem; display:flex; justify-content:space-between;">
          <span>${i.name}</span>
          <strong style="color:var(--primary);">${i.amount_g}g</strong>
        </div>
      `).join('');

      document.getElementById('detail-steps').innerText = recipe.steps || '暂无设置制作流程';
      document.getElementById('modal-detail').classList.add('active');
    }

    function openRecipeEditModal(id = null) {
      closeModal('modal-detail');
      document.getElementById('recipe-items-container').innerHTML = '';

      if (id) {
        const recipe = recipesData.find(r => r.id === id);
        if (!recipe) return;
        currentActiveRecipe = recipe;
        
        document.getElementById('modal-edit-title').innerText = '编辑菜谱';
        document.getElementById('edit-recipe-id').value = recipe.id;
        document.getElementById('recipe-name').value = recipe.name;
        document.getElementById('recipe-category').value = recipe.category || '家常菜';
        document.getElementById('recipe-video-url').value = recipe.video_url || '';
        document.getElementById('recipe-steps').value = recipe.steps || '';
        document.getElementById('recipe-img-base64').value = recipe.image_url || '';

        if (recipe.image_url) {
          document.getElementById('upload-preview-img').src = recipe.image_url;
          document.getElementById('upload-preview-img').style.display = 'block';
          document.getElementById('upload-placeholder').style.display = 'none';
        }

        if (recipe.ingredients && recipe.ingredients.length > 0) {
          recipe.ingredients.forEach(i => addRecipeItemRow(i.name, i.amount_g));
        } else {
          addRecipeItemRow();
        }
      } else {
        currentActiveRecipe = null;
        document.getElementById('modal-edit-title').innerText = '新建菜谱';
        document.getElementById('edit-recipe-id').value = '';
        document.getElementById('recipe-name').value = '';
        document.getElementById('recipe-category').value = '家常菜';
        document.getElementById('recipe-video-url').value = '';
        document.getElementById('recipe-steps').value = '';
        document.getElementById('recipe-img-base64').value = '';
        document.getElementById('upload-preview-img').style.display = 'none';
        document.getElementById('upload-placeholder').style.display = 'block';
        addRecipeItemRow();
      }

      document.getElementById('modal-edit').classList.add('active');
    }

    function handleImagePick(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height, maxDim = 600;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
            else { width = Math.round((width * maxDim) / height); height = maxDim; }
          }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('recipe-img-base64').value = compressedDataUrl;
          document.getElementById('upload-preview-img').src = compressedDataUrl;
          document.getElementById('upload-preview-img').style.display = 'block';
          document.getElementById('upload-placeholder').style.display = 'none';
        };
      };
      reader.readAsDataURL(file);
    }

    function closeModal(modalId) { document.getElementById(modalId).classList.remove('active'); }

    function addRecipeItemRow(name = '', amount = '') {
      const container = document.getElementById('recipe-items-container');
      const div = document.createElement('div');
      div.className = 'ingredient-input-row';
      div.innerHTML = `
        <input type="text" class="rec-item-name" placeholder="食材名" value="${name}">
        <input type="number" class="rec-item-amount" placeholder="克数" value="${amount}" style="width:90px;">
        <button class="btn-remove-row" onclick="this.parentElement.remove()">×</button>
      `;
      container.appendChild(div);
    }

    async function saveRecipe() {
      const editId = document.getElementById('edit-recipe-id').value;
      const name = document.getElementById('recipe-name').value.trim();
      const category = document.getElementById('recipe-category').value;
      const videoUrl = document.getElementById('recipe-video-url').value.trim();
      const steps = document.getElementById('recipe-steps').value.trim();
      const imageUrl = document.getElementById('recipe-img-base64').value;

      if (!name) return alert('请输入菜谱名称！');

      const nameInputs = document.querySelectorAll('.rec-item-name');
      const amountInputs = document.querySelectorAll('.rec-item-amount');
      const ingredients = [];

      nameInputs.forEach((input, index) => {
        const ingName = input.value.trim();
        const ingAmount = parseFloat(amountInputs[index].value);
        if (ingName && !isNaN(ingAmount) && ingAmount > 0) {
          ingredients.push({ name: ingName, amount_g: ingAmount });
        }
      });

      if (ingredients.length === 0) return alert('请至少添加一种有效食材！');

      const payload = { name, category, video_url: videoUrl, steps, image_url: imageUrl, ingredients };

      if (editId) await db.from('recipes').update(payload).eq('id', editId);
      else await db.from('recipes').insert([payload]);

      closeModal('modal-edit');
      refreshRecipes();
    }

    function editCurrentRecipe() { if (currentActiveRecipe) openRecipeEditModal(currentActiveRecipe.id); }

    async function deleteCurrentRecipe() {
      if (!currentActiveRecipe) return;
      if (confirm(`确定要删除菜谱“${currentActiveRecipe.name}”吗？`)) {
        await db.from('recipes').delete().eq('id', currentActiveRecipe.id);
        closeModal('modal-detail');
        refreshRecipes();
      }
    }
  </script>
