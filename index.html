<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活记录</title>
    <!-- 引入 Supabase 官方 JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            background-color: #3ecf8e;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2eaf73;
        }
        .card-list {
            margin-top: 30px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
        }
        .badge {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #eef2f7;
            color: #555;
            margin-left: 4px;
        }
        .card-content {
            font-size: 14px;
            color: #666;
            white-space: pre-wrap;
        }
        .card-time {
            font-size: 12px;
            color: #aaa;
            margin-top: 8px;
            text-align: right;
        }
    </style>
</head>
<body>

    <h1>📝 生活记录</h1>

    <!-- 记录表单 -->
    <form id="recordForm">
        <div class="form-group">
            <label for="title">标题</label>
            <input type="text" id="title" placeholder="输入记录标题..." required>
        </div>
        <div class="form-group">
            <label for="category">分类</label>
            <select id="category">
                <option value="工作">工作</option>
                <option value="生活">生活</option>
                <option value="灵感">灵感</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-group">
            <label for="priority">优先级</label>
            <select id="priority">
                <option value="普通">普通</option>
                <option value="重要">重要</option>
                <option value="紧急">紧急</option>
            </select>
        </div>
        <div class="form-group">
            <label for="content">详细内容</label>
            <textarea id="content" placeholder="输入具体内容..."></textarea>
        </div>
        <button type="submit" id="submitBtn">提交记录</button>
    </form>

    <!-- 列表展示区 -->
    <div class="card-list" id="recordList">
        <!-- 动态加载数据 -->
    </div>

    <script>
        // ==========================================
        // 1. Supabase 配置
        // ==========================================
        // ⚠️ 请将下面的 Project URL 替换为你的 Supabase 项目地址 (格式如 https://xxxx.supabase.co)
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_wUmuXR2Rub4-IEDidKTkrA_Pd-jlsj5';

        // 初始化 Supabase 客户端
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // 数据库表名 (需与你在 Supabase 中创建的表名一致，例如 records)
        const TABLE_NAME = 'records'; 

        // DOM 元素
        const form = document.getElementById('recordForm');
        const listContainer = document.getElementById('recordList');

        // ==========================================
        // 2. 读取并渲染数据
        // ==========================================
        async function fetchRecords() {
            listContainer.innerHTML = '<p style="text-align:center; color:#888;">加载中...</p>';
            
            const { data, error } = await _supabase
                .from(TABLE_NAME)
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('读取数据失败:', error);
                listContainer.innerHTML = `<p style="color:red; text-align:center;">读取失败，请检查 URL 和表名是否正确</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#888;">暂无记录，快来添加第一条吧！</p>';
                return;
            }

            listContainer.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${escapeHtml(item.title || '')}</span>
                        <div>
                            <span class="badge">${escapeHtml(item.category || '未分类')}</span>
                            <span class="badge" style="background:#ffe3e3; color:#c53030;">${escapeHtml(item.priority || '普通')}</span>
                        </div>
                    </div>
                    <div class="card-content">${escapeHtml(item.content || '')}</div>
                    <div class="card-time">${item.created_at ? new Date(item.created_at).toLocaleString('zh-CN') : ''}</div>
                `;
                listContainer.appendChild(card);
            });
        }

        // ==========================================
        // 3. 提交表单保存数据
        // ==========================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const priority = document.getElementById('priority').value;
            const content = document.getElementById('content').value.trim();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';

            const { data, error } = await _supabase
                .from(TABLE_NAME)
                .insert([{ title, category, priority, content }]);

            submitBtn.disabled = false;
            submitBtn.textContent = '提交记录';

            if (error) {
                alert('保存失败：' + error.message);
                console.error('写入错误:', error);
            } else {
                form.reset();
                fetchRecords(); // 重新加载数据列表
            }
        });

        // HTML 转义防注入
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // 页面加载完成后拉取历史数据
        window.addEventListener('DOMContentLoaded', fetchRecords);
    </script>
</body>
</html>
