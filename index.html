<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人自用数据采集</title>
  <!-- 引入 Tailwind CSS 样式库 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Supabase 官方 JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    <!-- 表单卡片 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">📝 快速记录面板</h1>

      <form id="recordForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">记录标题</label>
          <input type="text" id="title" required placeholder="输入标题..." 
                 class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">分类</label>
            <select id="category" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base bg-white">
              <option value="随手记">随手记</option>
              <option value="待办事项">待办事项</option>
              <option value="数据归档">数据归档</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">重要程度</label>
            <select id="priority" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base bg-white">
              <option value="普通">普通</option>
              <option value="紧急">紧急</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">详细内容</label>
          <textarea id="content" rows="3" placeholder="输入详细内容..." 
                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base"></textarea>
        </div>

        <button type="submit" id="submitBtn" 
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition duration-150">
          保存记录到云端
        </button>
      </form>
    </div>

    <!-- 历史记录展示卡片 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <h2 class="text-xl font-bold text-slate-800 mb-4">📋 历史记录</h2>
      <div id="recordsList" class="space-y-3 text-slate-500 text-sm">
        数据加载中...
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 记得把这两行替换成你在 Supabase 获取到的真实 URL 和 Key
    const SUPABASE_URL = 'https://你的项目ID.supabase.co';
    const SUPABASE_KEY = '你的anon_public_key';

    // 初始化 Supabase 客户端
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 页面加载时自动读取云端历史数据
    document.addEventListener('DOMContentLoaded', loadRecords);

    // 提交表单保存到 Supabase
    document.getElementById('recordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = '保存中...';
      btn.disabled = true;

      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const priority = document.getElementById('priority').value;
      const content = document.getElementById('content').value;

      // 写入 Supabase 数据库
      const { data, error } = await supabaseClient
        .from('records')
        .insert([{ title, category, priority, content }]);

      btn.disabled = false;
      btn.innerText = '保存记录到云端';

      if (error) {
        alert('保存失败：' + error.message);
      } else {
        document.getElementById('recordForm').reset();
        loadRecords(); // 刷新列表
      }
    });

    // 从 Supabase 查询历史记录并展示
    async function loadRecords() {
      const listDiv = document.getElementById('recordsList');
      const { data, error } = await supabaseClient
        .from('records')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        listDiv.innerHTML = '<p class="text-red-500">加载失败，请检查 Supabase 配置。</p>';
        return;
      }

      if (!data || data.length === 0) {
        listDiv.innerHTML = '<p>暂无记录。</p>';
        return;
      }

      // 动态生成渲染 HTML
      listDiv.innerHTML = data.map(item => `
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-800 text-base">${item.title}</span>
            <span class="text-xs px-2 py-0.5 rounded ${item.priority === '紧急' ? 'bg-red-100 text-red-600' : 'bg-slate-200 text-slate-600'}">${item.priority}</span>
          </div>
          <p class="text-slate-600 text-sm">${item.content || '无详细内容'}</p>
          <div class="flex justify-between text-xs text-slate-400 pt-1">
            <span>分类：${item.category}</span>
            <span>${new Date(item.created_at).toLocaleString()}</span>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
